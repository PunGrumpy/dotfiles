name: 🏠 Chezmoi

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  validate:
    name: 🔎 Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 🛫 Checkout
        uses: actions/checkout@v7
      - name: 📦 Install chezmoi
        if: runner.os != 'Windows'
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 📦 Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$HOME\bin'"
          "$HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: 🏠 Apply the files to an empty directory
        run: |
          target="$RUNNER_TEMP/home"
          mkdir -p "$target"
          echo "CHEZMOI_ARGS=--source=$GITHUB_WORKSPACE --destination=$target --config=$RUNNER_TEMP/chezmoi.toml --persistent-state=$RUNNER_TEMP/state.boltdb --no-tty" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/chezmoi.toml"
          chezmoi --source="$GITHUB_WORKSPACE" --destination="$target" --config="$RUNNER_TEMP/chezmoi.toml" --persistent-state="$RUNNER_TEMP/state.boltdb" --no-tty apply --exclude=scripts
          chezmoi --source="$GITHUB_WORKSPACE" --destination="$target" --config="$RUNNER_TEMP/chezmoi.toml" --persistent-state="$RUNNER_TEMP/state.boltdb" --no-tty verify --exclude=scripts
          find "$target" -type f | wc -l
      - name: 🧪 Check that bash scripts parse
        if: runner.os != 'Windows'
        run: |
          for script in home/run_*.sh.tmpl; do
            rendered="$(chezmoi $CHEZMOI_ARGS execute-template < "$script")"
            if [ -n "$rendered" ]; then
              bash -n <<<"$rendered"
              echo "ok $script"
            fi
          done
      - name: 🧪 Check that PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem home/run_*.ps1.tmpl | ForEach-Object {
            $rendered = chezmoi --source=$env:GITHUB_WORKSPACE --config="$env:RUNNER_TEMP/chezmoi.toml" --persistent-state="$env:RUNNER_TEMP/state.boltdb" execute-template (Get-Content -Raw $_.FullName)
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(($rendered -join "`n"), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$($_.Name): $errors" }
            "ok $($_.Name)"
          }
      - name: 🪣 Check that the Scoop packages exist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$HOME\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add extras
          scoop bucket add nerd-fonts
          $missing = Get-Content home/scoop-packages.txt | Where-Object { -not (scoop search $_ 6>&1 | Select-String -SimpleMatch $_) }
          if ($missing) { throw "not found in Scoop: $($missing -join ', ')" }

  bootstrap:
    name: 🚀 Bootstrap (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🛫 Checkout
        uses: actions/checkout@v7
      - name: 🚀 Apply with the run scripts
        env:
          NONINTERACTIVE: "1"
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/chezmoi" --source="$GITHUB_WORKSPACE" --no-tty apply --force
      - name: ✅ Check the result
        shell: /home/linuxbrew/.linuxbrew/bin/fish -l {0}
        run: |
          type -q nvim
          and type -q mise
          and type -q gwq
          and type -q tmux
          and fisher list | string match -q 'ilancosman/tide*'
          and mise ls --current go python rust
          and git config --get alias.st
          and type -q git-cz
          and test -d ~/.config/tmux/plugins/tpm
