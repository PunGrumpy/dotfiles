# vim: ft=tmux
set -g window-style fg=#a1a1a1,bg=default
set -g window-active-style fg=#ededed,bg=default

set -g mode-style "fg=#000000,bg=#47a8ff"

set -g message-style "fg=#ededed,bg=#2e2e2e"
set -g message-command-style "fg=#ededed,bg=#2e2e2e"

set -g pane-border-style "fg=#2e2e2e"
set -g pane-active-border-style "fg=#47a8ff"

set -g display-panes-active-colour "#47a8ff"
set -g display-panes-colour "#2e2e2e"

setw -g clock-mode-colour "#47a8ff"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#a1a1a1,bg=#1a1a1a"
set -g status-bg "#1a1a1a"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#000000,bg=#47a8ff,bold] #S:#I.#P #[fg=#47a8ff,bg=#2e2e2e,nobold,nounderscore,noitalics]#[fg=#ededed,bg=#2e2e2e,bold] #(whoami) #[fg=#2e2e2e,bg=#1a1a1a,nobold,nounderscore,noitalics]"

set -g status-right "#[fg=#2e2e2e,bg=#1a1a1a,nobold,nounderscore,noitalics]#[fg=#a1a1a1,bg=#2e2e2e] #[fg=#c472fb,bg=#2e2e2e,nobold,nounderscore,noitalics]#[fg=#000000,bg=#c472fb,bold] #h "

setw -g window-status-activity-style "underscore,fg=#ffae00,bg=#1a1a1a"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a1a1a1,bg=#1a1a1a"
setw -g window-status-current-style "fg=#47a8ff,bg=default,bright"
setw -g window-status-format '#[fg=#1a1a1a,bg=#1a1a1a]#[default] #I  #{b:pane_current_path} #[fg=#1a1a1a,bg=#1a1a1a,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1a1a1a,bg=#ededed]#[fg=#000000,bg=#ededed,bold] #I #[fg=#ededed,bg=#47a8ff]#[fg=#000000,bg=#47a8ff,bold] #{b:pane_current_path} #[fg=#47a8ff,bg=#1a1a1a,nobold]'
